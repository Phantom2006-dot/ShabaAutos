<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;display=swap');
      .shaba-text {
        font-family: 'Manrope', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
    </style>
  </defs>

  <!-- Car Silhouette: Aerodynamic Double Arch in Forest Green -->
  <g fill="#10b981">
    <!-- Upper main roofline arc -->
    <path d="M 14 36 C 26 34, 45 30, 72 26 C 90 23, 104 15, 126 12 C 152 8, 178 11, 202 20 C 220 27, 240 33, 266 41 C 269 42, 267 43.5, 263 43 C 238 36, 218 30, 200 24 C 176 16, 150 13, 126 17 C 104 20, 90 28, 70 31 C 46 35, 28 38, 12 38 C 10 38, 11 36.5, 14 36 Z" />
    
    <!-- Lower hood and windshield inner contour arc -->
    <path d="M 38 33 C 54 28, 72 21, 98 19 C 112 18, 122 19, 102 22 C 78 25, 58 32, 36 37 C 34 37.5, 35 35, 38 33 Z" opacity="0.95" />
    
    <!-- Rear shoulder aerodynamic taper -->
    <path d="M 166 23 C 188 28, 208 34, 232 40 C 235 41, 231 42, 226 41 C 204 36, 184 30, 164 25 C 162 24.5, 164 22.5, 166 23 Z" opacity="0.9" />
  </g>

  <!-- Wordmark: Shaba in Vivid Green, Autos in White -->
  <text x="18" y="69" class="shaba-text" font-size="31" font-weight="800" letter-spacing="-0.6">
    <tspan fill="#10b981">Shaba</tspan><tspan fill="#ffffff">Autos</tspan>
  </text>

  <!-- Tagline: Your Car. Your Choice. -->
  <text x="44" y="86" class="shaba-text" font-size="11" font-weight="600" fill="#cbd5e1" letter-spacing="0.2">
    Your Car. Your Choice.
  </text>

  <!-- Right Vertical Divider -->
  <line x1="298" y1="18" x2="298" y2="76" stroke="#10b981" stroke-width="3" stroke-linecap="round" />
</svg>
